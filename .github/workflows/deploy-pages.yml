name: Deploy to Cloudflare Pages

# CO 2026-07-13: auto-deploy the doctorsjournal-legal repo to Cloudflare Pages
# on every push to main. Was manual (`wrangler pages deploy`) — kept forgetting
# to redeploy after git push, so GitHub Pages was fresh while dj.brucys.me was
# stale. Fixed by wiring this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=dj-launch --branch=main --commit-dirty=true
